<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Skills | Joever L. Sayson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script>
        (function() {
            const saved = localStorage.getItem("theme");
            const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
            if (saved === "light" || (!saved && prefersLight)) document.documentElement.setAttribute("data-theme", "light");
        })();
    </script>
</head>

<body class="frame-body">

    <section class="section" id="skills">
        <div class="container">
            <div class="section-head reveal">
                <span class="section-icon"><i class="fa-solid fa-code"></i></span>
                <h2>Technical <span class="accent">Skills</span></h2>
                <p class="section-sub">Organized by engineering discipline for clarity.</p>
            </div>

            <div class="skills-grid" style="grid-template-columns: 1fr;">
                <!-- Single column for table-like look -->

                <!-- Programming -->
                <div class="skill-card reveal">
                    <div class="skill-head">
                        <i class="fa-solid fa-terminal"></i>

                    </div>
                    <div class="skill-images-grid">

                        <div class="skill-img-item" title="JavaScript"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript"></div>
                        <div class="skill-img-item" title="TypeScript"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" alt="TypeScript"></div>

                        <div class="skill-img-item" title="Java"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java"></div>
                        <!-- Bag-ong dugang: Flutter (Dart) -->
                        <div class="skill-img-item" title="Flutter"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flutter/flutter-original.svg" alt="Flutter"></div>
                        <div class="skill-img-item" title="Dart"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/dart/dart-original.svg" alt="Dart"></div>
                    </div>
                </div>

                <div class="skill-card reveal">
                    <div class="skill-head">
                        <i class="fa-solid fa-brain"></i>
                        <h3>AI & Machine Learning</h3>
                    </div>
                    <div class="skill-images-grid">
                        <div class="skill-img-item" title="TensorFlow"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tensorflow/tensorflow-original.svg" alt="TensorFlow"></div>

                        <div class="skill-img-item" title="YOLOv3"><i class="fa-solid fa-eye fallback-icon"></i></div>

                        <div class="skill-img-item" title="Transfer Learning"><i class="fa-solid fa-arrows-left-right fallback-icon"></i></div>
                    </div>
                </div>

                    </div>

                    <div class="skill-head">
