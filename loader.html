<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loading | Joever L. Sayson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="prefetch" href="index.html" />
    < <style>
        :root { --ink: #1f3a3a; --paper: #efe9df; --bar: #b9c2c4; --blue: #6fa8d6; --blue-d: #4c88bd; --shell: #8fb59a; --skin: #d9705f; --leg: #e8b865; } body { margin: 0; overflow: hidden; background: #030305; color: #f1f5f9; font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased; } [data-theme="light"] body { background: #f4f6fb; color: #0f172a; } .aurora-bg { position: fixed; inset: 0; z-index: 0; filter: blur(100px); opacity: .6; pointer-events: none; } [data-theme="light"] .aurora-bg
        { opacity: .35; filter: blur(120px); } .aurora-blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: float-blob 20s ease-in-out infinite alternate; } [data-theme="light"] .aurora-blob { mix-blend-mode: multiply; } .blob-1
        { width: 60vw; height: 60vw; top: -10%; left: -10%; background: radial-gradient(circle, rgba(6, 182, 212, .6), transparent 60%); } .blob-2 { width: 50vw; height: 50vw; bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(139, 92,
        246, .6), transparent 60%); animation-delay: -7s; } @keyframes float-blob { to { transform: translate(8%, -8%) scale(1.15); } } .tt-main { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0); animation: enter 1s cubic-bezier(.16, 1, .3, 1) backwards; } @keyframes enter { from { opacity: 0; transform: translateY(18px);
        } to { opacity: 1; transform: none; } } .entrance-loader.is-done .tt-main { opacity: 0; transform: translateY(-10px); transition: opacity .4s ease, transform .4s ease; } /* ---- Stage: turtle walks on top of the window ---- */ .tt-stage { --p:
        0; position: relative; width: min(440px, 88vw); padding-top: 62px; } .tt-turtle { position: absolute; top: 6px; left: 0; width: 96px; overflow: visible; will-change: transform; } .tt-body { animation: bob .6s ease-in-out infinite; } .tt-leg {
        transform-box: fill-box; transform-origin: 50% 8%; animation: step .6s ease-in-out infinite alternate; } .tt-leg.b { animation-direction: alternate-reverse; } .tt-spark { animation: spark .6s steps(2) infinite; } @keyframes bob { 50% { transform:
        translateY(-1.5px); } } @keyframes step { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } } @keyframes spark { 50% { opacity: .15; } } .is-ready .tt-leg, .is-ready .tt-spark { animation: none; } .is-ready .tt-body { animation:
        hop .5s ease-out; } @keyframes hop { 40% { transform: translateY(-14px); } } .is-still .tt-leg, .is-still .tt-spark, .is-still .tt-body { animation-play-state: paused; } /* ---- Browser window drawing ---- */ .tt-window { background: var(--paper);
        border: 3px solid var(--ink); border-radius: 10px 10px 14px 14px / 10px 10px 18px 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35); overflow: hidden; } .tt-titlebar { display: flex; gap: 6px; padding: 8px 12px; background: var(--bar); border-bottom:
        3px solid var(--ink); } .tt-titlebar i { width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--ink); } .tt-track { margin: 22px 18px; height: 24px; border: 3px solid var(--ink); border-radius: 8px; background: #f7f3ec; overflow:
        hidden; } .tt-fill { height: 100%; width: 0; background: repeating-linear-gradient(100deg, var(--blue) 0 14px, var(--blue-d) 14px 17px); border-right: 3px solid var(--ink); } /* ---- Status line ---- */ .tt-meta { width: min(440px, 88vw); display:
        flex; justify-content: space-between; font: 500 .9rem 'Inter', sans-serif; letter-spacing: .01em; } .tt-meta .tt-label { opacity: .85; } .tt-meta .tt-count { font: 600 .95rem 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; } .skip-btn
        { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 8px 14px; font: 500 .78rem 'Inter', sans-serif; color: inherit; background: rgba(255, 255, 255, .06);
        border: 1px solid rgba(148, 163, 184, .35); border-radius: 999px; cursor: pointer; } .skip-btn:hover { background: rgba(6, 182, 212, .18); } .skip-btn:focus-visible { outline: 2px solid #06b6d4; outline-offset: 3px; } .sr-only { position: absolute;
        width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } @media (prefers-reduced-motion: reduce) { .aurora-blob, .tt-body, .tt-leg, .tt-spark, .tt-main { animation: none; } }
        </style>

        <script>
            (function() {
                try {
                    const s = localStorage.getItem("theme");
                    if (s === "light" || (!s && matchMedia("(prefers-color-scheme: light)").matches)) {
                        document.documentElement.setAttribute("data-theme", "light");
                    }
                } catch (e) {}
            })();
        </script>
        <noscript><meta http-equiv="refresh" content="0; url=index.html#home" /></noscript>
</head>

<body>
    <div class="entrance-loader" id="entranceLoader">

        <div class="aurora-bg" aria-hidden="true">
            <div class="aurora-blob blob-1"></div>
            <div class="aurora-blob blob-2"></div>
        </div>
        <div class="loader-noise" aria-hidden="true"></div>

        <main class="tt-main">
            <div class="tt-stage" id="stage">

                <!-- Original doodle turtle, faces right -->
                <svg class="tt-turtle" viewBox="0 0 140 86" aria-hidden="true" fill="none" stroke="#1f3a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <g class="tt-body">
                        <!-- back legs -->
                        <g transform="translate(40 54)"><g class="tt-leg b"><rect x="-8" y="0" width="16" height="26" rx="7" fill="#e8b865" /></g></g>
                        <g transform="translate(58 54)"><g class="tt-leg"><rect x="-8" y="0" width="16" height="26" rx="7" fill="#e8b865" /></g></g>
                        <!-- tail -->
                        <path d="M26 60 Q12 60 8 50 Q18 52 30 54Z" fill="#d9705f" />
                        <!-- underbody -->
                        <ellipse cx="70" cy="60" rx="44" ry="9" fill="#d9705f" />
                        <!-- front legs -->
                        <g transform="translate(90 54)"><g class="tt-leg"><rect x="-8" y="0" width="16" height="26" rx="7" fill="#e8b865" /></g></g>
                        <g transform="translate(104 54)"><g class="tt-leg b"><rect x="-8" y="0" width="16" height="26" rx="7" fill="#e8b865" /></g></g>
                        <!-- neck + head -->
                        <path d="M102 56 Q114 40 118 32" stroke-width="10" stroke="#1f3a3a" />
                        <path d="M102 56 Q114 40 118 32" stroke-width="4" stroke="#d9705f" />
                        <circle cx="123" cy="30" r="11" fill="#d9705f" />
                        <circle cx="126" cy="27" r="1.6" fill="#1f3a3a" stroke="none" />
                        <path d="M124 35 q4 1 7 -2" stroke-width="2" />
                        <!-- shell -->
                        <path d="M24 60 Q28 18 70 16 Q112 18 116 60Z" fill="#8fb59a" />
                        <path d="M48 60 Q46 38 58 24 M70 60 V17 M92 60 Q94 38 82 24 M30 46 Q70 40 110 46" stroke-width="2.5" />
                    </g>
                    <!-- effort sparks in front of the head -->
                    <g class="tt-spark" stroke="#4c88bd" stroke-width="3.5">
                        <path d="M136 10 L131 16" /><path d="M138 22 L134 24" /><path d="M128 6 L127 13" />
                    </g>
                </svg>

                <div class="tt-window">
                    <div class="tt-titlebar" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="tt-track" id="progressTrack" role="progressbar" aria-label="Page loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="tt-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <div class="tt-meta">
                <span class="tt-label" id="progressStatus">Taking it slow</span>
                <span class="tt-count" id="progressCount" aria-hidden="true">0%</span>
            </div>
            <p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>
        </main>

        <button type="button" class="skip-btn" id="skipBtn">Skip intro</button>

        <div class="exit-curtain" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <script>
        (function() {
            const TARGET = "index.html#home";
            const $ = (id) => document.getElementById(id);
            const loader = $("entranceLoader"),
                stage = $("stage"),
                fill = $("progressFill"),
                status = $("progressStatus"),
                count = $("progressCount"),
                track = $("progressTrack"),
                live = $("liveStatus");
            const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

            let seen = false;
            try {
                seen = sessionStorage.getItem("introSeen") === "1";
                sessionStorage.setItem("introSeen", "1");
            } catch (e) {}

            // Long enough for the turtle to be seen, short for returning visitors
            const MIN_MS = reduced ? 300 : (seen ? 800 : 2800);
            const MAX_MS = 6500;
            const EXIT_MS = reduced ? 300 : 1100;

            const labels = [
                [0, "Taking it slow"],
                [25, "Loading modules"],
                [55, "Syncing data"],
                [85, "Almost there"],
                [100, "Made it"]
            ];

            const tasks = {
                fonts: false,
                page: false
            };
            const done = (k) => () => {
                tasks[k] = true;
            };
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(done("fonts"), done("fonts"));
            else tasks.fonts = true;
            if (document.readyState === "complete") tasks.page = true;
            else addEventListener("load", done("page"));

            const real = () => {
                const v = Object.values(tasks);
                return v.filter(Boolean).length / v.length;
            };

            const turtle = stage.querySelector(".tt-turtle");
            let stageW = stage.clientWidth;
            addEventListener("resize", () => {
                stageW = stage.clientWidth;
            });
            let shown = 0,
                last = "",
                finished = false;
            const t0 = performance.now();

            function render(pct) {
                const p = Math.round(pct);
                fill.style.width = pct + "%";
                const x = stageW * (0.05 + pct * 0.008) - 48;
                turtle.style.transform = `translate3d(${x.toFixed(1)}px,0,0)`;
                count.textContent = p + "%";
                track.setAttribute("aria-valuenow", p);
                let label = labels[0][1];
                for (const [at, text] of labels)
                    if (pct >= at) label = text;
                if (label !== last) {
                    last = label;
                    status.textContent = label;
                    live.textContent = label;
                }
            }

            function finish() {
                if (finished) return;
                finished = true;
                render(100);
                stage.classList.remove("is-still");
                loader.classList.add("is-done", "is-ready");
                setTimeout(() => location.replace(TARGET), EXIT_MS);
            }

            function frame(now) {
                if (finished) return;
                const dt = Math.max(0, Math.min(now - (frame.prev || now), 50));
                frame.prev = now;
                const el = now - t0;
                const t = Math.min(el / MIN_MS, 1);
                const byTime = t * t * (3 - 2 * t) * 100;
                const r = real();
                const ceiling = r === 1 ? 100 : Math.min(25 + r * 70, 90);
                let target = Math.min(byTime, ceiling);
                if (el > MAX_MS) target = 100;
                const before = shown;
                shown += (target - shown) * (1 - Math.exp(-dt / 140));
                if (target - shown < 0.15) shown = target;
                stage.classList.toggle("is-still", shown - before < 0.01 && shown < 100);
                render(shown);
                if (shown >= 100) return finish();
                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
            $("skipBtn").addEventListener("click", finish);
            addEventListener("keydown", (e) => {
                if (e.key === "Escape" || e.key === "Enter") finish();
            });
        })();
    </script>
</body>

</html>
